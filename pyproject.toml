[project]
name = "agentbi-orchestrator"
version = "0.1.0"
description = "A secure AgentBI orchestration layer for Apache Superset and SuperSonic"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "pydantic>=2.8,<3",
  "sqlalchemy>=1.4,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
